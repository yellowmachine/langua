services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langua}
      POSTGRES_DB: ${POSTGRES_DB:-langua}
      APP_DB_USER: ${APP_DB_USER:-langua_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-langua_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-langua}']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: pulls the default chat model on first start so the family
  # doesn't have to run `docker exec` themselves. Exits once done; re-runs
  # (and no-ops, ollama skips already-pulled models) on every `compose up`.
  ollama-pull:
    image: ollama/ollama:latest
    restart: 'no'
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "waiting for ollama..."
          sleep 2
        done
        ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b}

  tts:
    build: ./docker/tts
    restart: unless-stopped
    ports:
      - 5002:5000
    volumes:
      - tts_voices:/data/voices

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - 5004:8000
    volumes:
      - stt_models:/root/.cache/huggingface

  # One-shot: sends a tiny silent clip so the default model is downloaded
  # and loaded on first start, not on the family's first real recording.
  stt-warmup:
    image: curlimages/curl:latest
    restart: 'no'
    depends_on:
      - stt
    volumes:
      - ./docker/stt/warmup.wav:/warmup.wav:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until curl -sf http://stt:8000/health >/dev/null 2>&1; do
          echo "waiting for stt..."
          sleep 2
        done
        curl -sf -X POST http://stt:8000/v1/audio/transcriptions \
          -F "file=@/warmup.wav" \
          -F "model=${STT_MODEL:-Systran/faster-whisper-small}" >/dev/null
        echo "stt: model warmed up"

volumes:
  pgdata:
  ollama_data:
  tts_voices:
  stt_models:
