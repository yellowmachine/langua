services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langua}
      POSTGRES_DB: ${POSTGRES_DB:-langua}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-langua}']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
