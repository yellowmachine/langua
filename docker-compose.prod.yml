name: langua-prod

# Full stack for an actual self-hosted deployment (or a "does this really
# work end to end" test) — as opposed to compose.yaml, which only runs the
# infra services with host-published ports for `bun run dev`.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# `app` and `migrate` both pull the same prebuilt image from GHCR instead
# of building locally — .github/workflows/docker-build.yml builds and
# pushes it on every push to main (tagged `latest`) and on `v*` tags
# (tagged with the version). Set APP_IMAGE_TAG in .env.prod to pin a
# specific tag/sha instead of `latest`. If the GHCR package is private,
# `docker login ghcr.io` on the deploy host first (a classic PAT with
# `read:packages` works as the password).
#
# No service publishes a host port — a reverse proxy (e.g. Dokploy/Traefik)
# is expected to sit in front and reach `app` over the compose network on
# its container port (3000, see PORT below). Point the proxy's domain at
# service `app`, port 3000.
#
# Ollama (local LLM fallback for chat) is gated behind the `local-ai` Compose
# profile — it's the one service here heavy enough (2-4GB+ RAM just to load
# a small model) to matter on a modest VPS. STT/TTS stay always-on: they're
# CPU-only and lightweight (faster-whisper-small, Piper) and have no cloud
# fallback implemented yet. Add `--profile local-ai` to the `up` command (or
# set COMPOSE_PROFILES=local-ai in .env.prod) to run Ollama too; without it,
# configure an OpenRouter key in Settings after first deploy so chat has a
# provider to talk to.
#
# On a box with a dedicated AMD GPU, layer docker-compose.prod.amd.yml on
# top to run Ollama on ROCm instead of the CPU — see that file for usage
# (still needs the local-ai profile enabled).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-langua}
      APP_DB_USER: ${APP_DB_USER:-langua_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-langua}']
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ['local-ai']
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    restart: 'no'
    profiles: ['local-ai']
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "waiting for ollama..."
          sleep 2
        done
        ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b}

  tts:
    build: ./docker/tts
    restart: unless-stopped
    volumes:
      - tts_voices:/data/voices

  stt:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    volumes:
      - stt_models:/root/.cache/huggingface

  stt-warmup:
    image: curlimages/curl:latest
    restart: 'no'
    depends_on:
      - stt
    volumes:
      - ./docker/stt/warmup.wav:/warmup.wav:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until curl -sf http://stt:8000/health >/dev/null 2>&1; do
          echo "waiting for stt..."
          sleep 2
        done
        curl -sf -X POST http://stt:8000/v1/audio/transcriptions \
          -F "file=@/warmup.wav" \
          -F "model=${STT_MODEL:-Systran/faster-whisper-small}" >/dev/null
        echo "stt: model warmed up"

  # Runs on the same GHCR image as `app` (see db:migrate:prod / scripts/
  # migrate.ts) but as its own step, connected as POSTGRES_USER — the
  # superuser/table owner, needed because RLS policies don't apply to
  # them. `app` connects as the restricted APP_DB_USER instead so RLS is
  # actually enforced at runtime; it never sees these credentials.
  # pull_policy: always — the deploy webhook just re-runs `up -d`, which
  # otherwise reuses whatever image already sits under the `latest` tag
  # locally instead of checking GHCR for a newer one.
  migrate:
    image: ghcr.io/yellowmachine/langua:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-langua}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-langua}
    command: ['bun', 'run', 'db:migrate:prod']

  app:
    image: ghcr.io/yellowmachine/langua:${APP_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tts:
        condition: service_started
      stt:
        condition: service_started
    environment:
      PORT: 3000
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BODY_SIZE_LIMIT: 20M
      DATABASE_URL: postgres://${APP_DB_USER:-langua_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-langua}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env.prod (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${ORIGIN:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env.prod (openssl rand -base64 32)}
      # Only reachable if the `local-ai` profile is enabled; harmless
      # otherwise since chat falls back here only when no OpenRouter key/
      # cloud mode is configured in Settings.
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      TTS_BASE_URL: http://tts:5000
      STT_BASE_URL: http://stt:8000
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      AUDIO_CACHE_DIR: /data/audio
    volumes:
      - audio_cache:/data/audio

volumes:
  pgdata:
  ollama_data:
  tts_voices:
  stt_models:
  audio_cache:
