name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy's `pull_policy: always` only helps if `:latest` on GHCR already
      # points at the image we just pushed. Firing the webhook immediately can
      # race GHCR's tag propagation and pull the previous image instead — wait
      # here until `:latest` resolves to our digest before triggering deploy.
      - name: Wait for GHCR latest tag to reflect pushed digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          target="${{ steps.build.outputs.digest }}"
          echo "Waiting for $image:latest to resolve to $target"
          for i in $(seq 1 30); do
            current=$(docker buildx imagetools inspect "$image:latest" 2>/dev/null \
              | awk '/^Digest:/ { print $2; exit }')
            if [ "$current" = "$target" ]; then
              echo "Matched after $i attempt(s): $current"
              exit 0
            fi
            echo "Attempt $i/30: latest is '$current', want '$target' — retrying in 5s"
            sleep 5
          done
          echo "::error::Timed out waiting for $image:latest to reflect $target"
          exit 1

      - name: Trigger Dokploy redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}"

      - name: Notify Slack on successful deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --silent --show-error -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ *Deployed to production* · \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver en GitHub Actions>\"}"

  notify-failure:
    needs: build-and-push
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on workflow failure
        run: |
          curl --silent --show-error -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🔴 *Build failed* · \`${{ github.repository }}\` · branch \`${{ github.ref_name }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver en GitHub Actions>\"}"
